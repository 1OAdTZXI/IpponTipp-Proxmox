map $http_x_forwarded_proto $ippontipp_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;

    location /static/ {
        alias /opt/ippontipp/current/static/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://unix:/run/ippontipp/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ippontipp_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
